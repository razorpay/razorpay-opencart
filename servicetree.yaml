service: razorpay-opencart  # required, canonical slug — immutable once registered
displayName: "Razorpay Payment Extension for OpenCart"  # README title "## Razorpay Payment Extension for Opencart" (OpenCart capitalisation corrected)
description: "Razorpay's official OpenCart extension, which lets Indian merchants accept credit cards, debit cards, net banking and wallets through the Razorpay API without redirecting away from the OpenCart site."  # README verbatim ("This extension utilizes Razorpay API and provides seamless integration with OpenCart, allowing payments for Indian merchants via Credit Cards, Debit Cards, Net Banking, Wallets, etc. without redirecting away from the OpenCart site")
type: library  # a PHP plugin installed into merchants' OpenCart stores — no server deployment of its own; type library per the batch rule for plugins · retype after the serviceTypes enum widens: sdk
tier: T2  # a merchant-facing payment integration — a broken release degrades checkout for the merchants using it, but the blast radius is limited to OpenCart merchants and rollout is per-merchant; T2 supporting the payments product
lifecycle: live  # published, maintained plugin with recent commits (2026-08-19) — live

domain: razorpay1/partnerships  # family razorpay1 from the registry seed BU "SME Payments"; area partnerships from csv_team "Partnerships" (platform plugins sit with Partnerships)

