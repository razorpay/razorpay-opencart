name: Package OpenCart 4 release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published OpenCart 4 release tag (opencart4-x.y.z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (startsWith(github.event.release.tag_name, 'opencart4-') && github.event.release.target_commitish == 'master')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^opencart4-[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid OpenCart 4 release tag: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Verify manually selected release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_ok="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '.isDraft == false and .targetCommitish == "master"')"
          [[ "$release_ok" == true ]] || {
            echo "Release must be published and target master" >&2
            exit 1
          }

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source and version
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/master || {
            echo "master ref is missing from checkout" >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/master || {
            echo "Release tag is not on master" >&2
            exit 1
          }
          package_version="$(python3 -c 'import json; print(json.load(open("install.json"))["version"])')"
          [[ "$RELEASE_TAG" == "opencart4-$package_version" ]] || {
            echo "Release tag and install.json version differ" >&2
            exit 1
          }

      - name: Build and verify OpenCart package
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r "$RUNNER_TEMP/razorpay.ocmod.zip" admin catalog system install.json -x '*/.*'
          unzip -tq "$RUNNER_TEMP/razorpay.ocmod.zip"
          if unzip -Z1 "$RUNNER_TEMP/razorpay.ocmod.zip" | grep -Eq '(^|/)(\.[^/]+|__MACOSX)(/|$)|^README\.md$'; then
            echo "Package contains unexpected files" >&2
            exit 1
          fi

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/razorpay.ocmod.zip" --repo "$GITHUB_REPOSITORY"
